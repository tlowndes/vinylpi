name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/*.sh image/stage-vinylpi/prerun.sh image/stage-vinylpi/00-vinylpi/*.sh
      - name: Python compiles
        run: python3 -m py_compile app/*.py
      - name: JavaScript parses
        run: node --check app/static/app.js
