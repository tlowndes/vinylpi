name: Build Pi image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the Pi updates itself with git, so it needs real history
          persist-credentials: false # never bake a token into the image
          path: src

      - name: Put the repo into the custom stage
        run: |
          mkdir -p src/image/stage-vinylpi/00-vinylpi/files
          rsync -a --exclude image/stage-vinylpi/00-vinylpi/files src/ src/image/stage-vinylpi/00-vinylpi/files/vinyl-pi/
          git -C src/image/stage-vinylpi/00-vinylpi/files/vinyl-pi remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C src/image/stage-vinylpi/00-vinylpi/files/vinyl-pi checkout -B main

      # pi-gen needs ~15 GB. The action's own increase-runner-disk-size step fails with an apt error
      # on current runners, so free the space by deleting preinstalled toolchains instead.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # pi-gen needs a password to skip the first-boot user setup. Nobody logs in as pi (SSH is off and
      # the web app does everything), so give it a random one that is never stored or shown.
      - name: Random password for the pi user
        id: pw
        run: |
          pw=$(openssl rand -base64 30 | tr -d '/+=')
          echo "::add-mask::$pw"
          echo "pw=$pw" >> "$GITHUB_OUTPUT"

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: vinylpi
          release: trixie
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./src/image/stage-vinylpi
          hostname: vinyl
          username: pi
          password: ${{ steps.pw.outputs.pw }}
          enable-ssh: 0              # no shell with a default password; use the manual install if you want SSH
          disable-first-boot-user-rename: 1
          locale: en_GB.UTF-8
          keyboard-keymap: gb
          keyboard-layout: English (UK)
          timezone: Europe/London
          wpa-country: GB
          compression: xz
          increase-runner-disk-size: false
          verbose-output: true

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: vinylpi-image
          path: ${{ steps.build.outputs.image-path }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.build.outputs.image-path }}
