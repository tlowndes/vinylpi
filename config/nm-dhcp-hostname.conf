# Vinyl Pi: send "vinylpi" to the router as this Pi's name when it asks for an address (DHCP).
# Routers that list DHCP names (OpenWrt, pfSense, Pi-hole, FritzBox and most others) then answer
# vinylpi.<your home domain>, for example vinylpi.home.arpa.
[connection]
ipv4.dhcp-hostname=vinylpi
ipv6.dhcp-hostname=vinylpi
